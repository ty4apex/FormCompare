<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FORM COMPARE</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FORM CMP">
<link rel="apple-touch-icon" href="icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0a0a0c;
    --surface: #111116;
    --panel: #16161e;
    --accent: #e8ff47;
    --text: #f0f0f0;
    --muted: #555566;
    --border: #222230;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--accent);
    line-height: 1;
  }

  .logo span { color: var(--muted); font-size: 14px; letter-spacing: 2px; }

  .header-controls { display: flex; gap: 8px; align-items: center; }

  .layout-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .layout-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,255,71,0.08);
  }

  /* VIDEO AREA */
  #video-area {
    flex: 1;
    display: flex;
    overflow: hidden;
    min-height: 0;
  }

  #video-area.layout-v { flex-direction: column; }
  #video-area.layout-h { flex-direction: row; }

  .video-slot {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    background: #000;
    overflow: hidden;
    min-height: 0;
    min-width: 0;
  }

  #video-area.layout-v .video-slot:first-child { border-bottom: 2px solid var(--accent); }
  #video-area.layout-h .video-slot:first-child { border-right: 2px solid var(--accent); }

  .video-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* UPLOAD ZONE */
  .upload-zone {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    background: #000;
  }

  .upload-zone.hidden { display: none; }

  .upload-icon {
    width: 48px;
    height: 48px;
    border: 2px dashed var(--muted);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .upload-text {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.6;
  }

  input[type="file"] { display: none; }

  /* SLOT LABEL */
  .slot-label {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.75);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--accent);
    pointer-events: none;
    z-index: 5;
    display: none;
  }

  .change-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.75);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    z-index: 5;
    font-family: 'DM Mono', monospace;
    display: none;
  }

  /* CONTROLS */
  #controls {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 16px 14px;
    flex-shrink: 0;
  }

  .scrubber-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .time-label {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 36px;
    text-align: right;
  }

  #scrubber {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }

  #scrubber::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px rgba(232,255,71,0.4);
  }

  .sync-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    cursor: pointer;
    user-select: none;
    flex-shrink: 0;
  }

  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.2s;
  }

  .sync-toggle.on { color: var(--accent); }
  .sync-toggle.on .sync-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  .btn-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .ctrl-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
  }

  .ctrl-btn:active { transform: scale(0.93); }

  .ctrl-btn.primary {
    width: 52px;
    height: 52px;
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,255,71,0.06);
  }

  .ctrl-btn.secondary {
    width: 40px;
    height: 40px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .ctrl-btn.secondary:hover { color: var(--text); }

  .speed-select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    height: 40px;
    letter-spacing: 1px;
  }

  .frame-info {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">FORM<span> COMPARE</span></div>
  <div class="header-controls">
    <button class="layout-btn active" id="btn-v" onclick="setLayout('v')">縦並び</button>
    <button class="layout-btn" id="btn-h" onclick="setLayout('h')">横並び</button>
  </div>
</header>

<div id="video-area" class="layout-v">

  <div class="video-slot" id="slot-a">
    <div class="video-wrapper">
      <div class="upload-zone" id="zone-a" onclick="triggerFile('a')">
        <div class="upload-icon">
          <svg width="20" height="20" fill="none" stroke="#555566" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M15 10l-4 4-4-4M12 14V3"/>
            <rect x="3" y="17" width="18" height="4" rx="2"/>
          </svg>
        </div>
        <div class="upload-text">VIDEO A<br>タップして選択</div>
      </div>
      <div class="slot-label" id="label-a">VIDEO A</div>
      <button class="change-btn" id="change-a" onclick="triggerFile('a')">CHANGE</button>
      <video id="video-a" preload="metadata" playsinline webkit-playsinline></video>
    </div>
    <input type="file" id="file-a" accept="video/*" onchange="loadVideo('a',this)">
  </div>

  <div class="video-slot" id="slot-b">
    <div class="video-wrapper">
      <div class="upload-zone" id="zone-b" onclick="triggerFile('b')">
        <div class="upload-icon">
          <svg width="20" height="20" fill="none" stroke="#555566" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M15 10l-4 4-4-4M12 14V3"/>
            <rect x="3" y="17" width="18" height="4" rx="2"/>
          </svg>
        </div>
        <div class="upload-text">VIDEO B<br>タップして選択</div>
      </div>
      <div class="slot-label" id="label-b">VIDEO B</div>
      <button class="change-btn" id="change-b" onclick="triggerFile('b')">CHANGE</button>
      <video id="video-b" preload="metadata" playsinline webkit-playsinline></video>
    </div>
    <input type="file" id="file-b" accept="video/*" onchange="loadVideo('b',this)">
  </div>

</div>

<div id="controls">
  <div class="scrubber-row">
    <span class="time-label" id="time-cur">0:00</span>
    <input type="range" id="scrubber" min="0" max="1000" step="1" value="0"
           oninput="onScrub(this.value)">
    <span class="time-label" id="time-dur">0:00</span>
    <div class="sync-toggle on" id="sync-toggle" onclick="toggleSync()">
      <div class="sync-dot"></div>
      SYNC
    </div>
  </div>

  <div class="btn-row">
    <button class="ctrl-btn secondary" onclick="seekStep(-10)">-10s</button>
    <button class="ctrl-btn secondary" onclick="seekFrame(-1)">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn primary" id="play-btn" onclick="togglePlay()">
      <svg id="play-icon" width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pause-icon" width="22" height="22" fill="currentColor" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="ctrl-btn secondary" onclick="seekFrame(1)">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 4V8l-5.5 4zM16 6h2v12h-2z"/></svg>
    </button>
    <button class="ctrl-btn secondary" onclick="seekStep(10)">+10s</button>
    <select class="speed-select" onchange="setSpeed(this.value)">
      <option value="0.25">0.25x</option>
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
  </div>
  <div class="frame-info">◀▶ フレーム送り (1/30s)</div>
</div>

<script>
  const vA = document.getElementById('video-a');
  const vB = document.getElementById('video-b');
  const scrubber = document.getElementById('scrubber');
  const timeCur = document.getElementById('time-cur');
  const timeDur = document.getElementById('time-dur');
  const playIcon = document.getElementById('play-icon');
  const pauseIcon = document.getElementById('pause-icon');

  let hasA = false, hasB = false;
  let syncEnabled = true;
  let isScrubbing = false;
  let rafId = null;
  let syncTimer = null;
  const objectUrls = { a: null, b: null };

  const FRAME = 1 / 30;
  const DRIFT_SOFT_LIMIT = 0.035;
  const DRIFT_HARD_LIMIT = 0.25;
  const MAX_RATE_OFFSET = 0.08;
  const SYNC_INTERVAL_MS = 180;

  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function clamp(v, min, max) {
    return Math.min(max, Math.max(min, v));
  }

  function getMasterVideo() {
    if (hasA) return vA;
    if (hasB) return vB;
    return null;
  }

  function paintScrubber(pct) {
    const safePct = clamp(pct, 0, 1);
    const fill = safePct * 100;
    scrubber.value = Math.round(safePct * 1000);
    scrubber.style.background = `linear-gradient(to right,#e8ff47 ${fill}%,#222230 ${fill}%)`;
  }

  function updateTimeUi() {
    if (isScrubbing) return;
    const master = getMasterVideo();
    if (!master) {
      paintScrubber(0);
      timeCur.textContent = '0:00';
      timeDur.textContent = '0:00';
      return;
    }

    const dur = master.duration || 0;
    const pct = dur ? master.currentTime / dur : 0;
    const val = Math.round(pct * 1000);
    scrubber.value = val;
    paintScrubber(pct);
    timeCur.textContent = fmt(master.currentTime);
    timeDur.textContent = fmt(dur);
  }

  function refreshPlayUi() {
    const isPlaying = (hasA && !vA.paused) || (hasB && !vB.paused);
    playIcon.style.display = isPlaying ? 'none' : 'block';
    pauseIcon.style.display = isPlaying ? 'block' : 'none';
  }

  function bothPaused() {
    const aPaused = !hasA || vA.paused;
    const bPaused = !hasB || vB.paused;
    return aPaused && bPaused;
  }

  function syncSlaveToMaster(forceSeek = false) {
    if (!syncEnabled || !hasA || !hasB || isScrubbing) return;
    if (!forceSeek && (vA.paused || vB.paused)) return;

    const drift = vA.currentTime - vB.currentTime;
    const absDrift = Math.abs(drift);

    if (forceSeek || absDrift > DRIFT_HARD_LIMIT) {
      // Hard seek is expensive, so do it only when drift is large.
      vB.currentTime = vA.currentTime;
      vB.playbackRate = vA.playbackRate;
      return;
    }

    if (absDrift > DRIFT_SOFT_LIMIT) {
      const delta = clamp(drift * 0.25, -MAX_RATE_OFFSET, MAX_RATE_OFFSET);
      vB.playbackRate = clamp(vA.playbackRate + delta, 0.25, 2);
      return;
    }

    vB.playbackRate = vA.playbackRate;
  }

  function tick() {
    updateTimeUi();
    if (!bothPaused()) {
      rafId = requestAnimationFrame(tick);
    } else {
      rafId = null;
    }
  }

  function startTick() {
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  function stopTick() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  function startSyncLoop() {
    if (syncTimer || !syncEnabled || !hasA || !hasB) return;
    syncTimer = setInterval(() => syncSlaveToMaster(false), SYNC_INTERVAL_MS);
  }

  function stopSyncLoop() {
    if (syncTimer) {
      clearInterval(syncTimer);
      syncTimer = null;
    }
    if (hasB && hasA) vB.playbackRate = vA.playbackRate;
  }

  function startRuntimeLoops() {
    startTick();
    startSyncLoop();
  }

  function stopRuntimeLoops() {
    stopTick();
    stopSyncLoop();
  }

  updateTimeUi();

  function setLayout(dir) {
    document.getElementById('video-area').className = 'layout-' + dir;
    document.getElementById('btn-v').classList.toggle('active', dir === 'v');
    document.getElementById('btn-h').classList.toggle('active', dir === 'h');
  }

  function triggerFile(id) {
    document.getElementById('file-' + id).click();
  }

  function loadVideo(id, input) {
    const file = input.files[0];
    if (!file) return;
    const vid = id === 'a' ? vA : vB;

    if (objectUrls[id]) URL.revokeObjectURL(objectUrls[id]);
    objectUrls[id] = URL.createObjectURL(file);
    vid.src = objectUrls[id];
    vid.load();

    document.getElementById('zone-' + id).classList.add('hidden');
    document.getElementById('label-' + id).style.display = 'block';
    document.getElementById('change-' + id).style.display = 'block';

    if (id === 'a') hasA = true; else hasB = true;

    vid.addEventListener('loadedmetadata', () => {
      updateTimeUi();
    }, { once: true });
  }

  async function togglePlay() {
    const isPlaying = (hasA && !vA.paused) || (hasB && !vB.paused);

    if (isPlaying) {
      if (hasA) vA.pause();
      if (hasB) vB.pause();
      stopRuntimeLoops();
      refreshPlayUi();
      return;
    }

    // Sync B to A before playing
    if (hasA && hasB && syncEnabled) {
      syncSlaveToMaster(true);
    }

    const plays = [];
    if (hasA) plays.push(vA.play());
    if (hasB) plays.push(vB.play());

    try {
      await Promise.all(plays);
    } catch(e) { /* autoplay blocked etc */ }

    startRuntimeLoops();
    refreshPlayUi();
  }

  function onScrub(val) {
    isScrubbing = true;
    const pct = val / 1000;
    if (hasA && vA.duration) vA.currentTime = vA.duration * pct;
    if (hasB && syncEnabled && vB.duration) vB.currentTime = vB.duration * pct;
    if (!hasA && hasB && vB.duration) vB.currentTime = vB.duration * pct;
    paintScrubber(pct);
    const master = getMasterVideo();
    timeCur.textContent = fmt(master ? master.currentTime : 0);
    clearTimeout(onScrub._t);
    onScrub._t = setTimeout(() => {
      isScrubbing = false;
      if (syncEnabled) syncSlaveToMaster(true);
      updateTimeUi();
    }, 120);
  }

  function seekStep(secs) {
    if (hasA) vA.currentTime = Math.max(0, Math.min(vA.duration || 0, vA.currentTime + secs));
    if (!hasA && hasB) vB.currentTime = Math.max(0, Math.min(vB.duration || 0, vB.currentTime + secs));
    if (hasB && hasA && syncEnabled) vB.currentTime = Math.max(0, Math.min(vB.duration || 0, vA.currentTime));
    if (syncEnabled) syncSlaveToMaster(true);
    updateTimeUi();
  }

  function seekFrame(dir) {
    if (hasA) vA.pause();
    if (hasB) vB.pause();
    stopRuntimeLoops();
    refreshPlayUi();
    if (hasA) vA.currentTime = Math.max(0, Math.min(vA.duration || 0, vA.currentTime + dir * FRAME));
    if (!hasA && hasB) vB.currentTime = Math.max(0, Math.min(vB.duration || 0, vB.currentTime + dir * FRAME));
    if (hasB && hasA && syncEnabled) vB.currentTime = Math.max(0, Math.min(vB.duration || 0, vA.currentTime));
    if (syncEnabled) syncSlaveToMaster(true);
    updateTimeUi();
  }

  function setSpeed(val) {
    const s = parseFloat(val);
    if (hasA) vA.playbackRate = s;
    if (hasB) vB.playbackRate = s;
    if (syncEnabled) syncSlaveToMaster(true);
  }

  function toggleSync() {
    syncEnabled = !syncEnabled;
    document.getElementById('sync-toggle').classList.toggle('on', syncEnabled);
    if (syncEnabled) {
      syncSlaveToMaster(true);
      startSyncLoop();
    } else {
      stopSyncLoop();
    }
  }

  [vA, vB].forEach(v => {
    v.addEventListener('play', () => {
      startRuntimeLoops();
      refreshPlayUi();
    });

    v.addEventListener('pause', () => {
      if (bothPaused()) stopRuntimeLoops();
      refreshPlayUi();
    });

    v.addEventListener('ended', () => {
      if (bothPaused()) stopRuntimeLoops();
      refreshPlayUi();
      updateTimeUi();
    });
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowLeft') { e.preventDefault(); seekFrame(-1); }
    if (e.code === 'ArrowRight') { e.preventDefault(); seekFrame(1); }
    if (e.code === 'KeyJ') seekStep(-10);
    if (e.code === 'KeyL') seekStep(10);
  });

  window.addEventListener('beforeunload', () => {
    if (objectUrls.a) URL.revokeObjectURL(objectUrls.a);
    if (objectUrls.b) URL.revokeObjectURL(objectUrls.b);
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
</body>
</html>
