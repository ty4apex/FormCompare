<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FORM COMPARE</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FORM CMP">
<link rel="apple-touch-icon" href="icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0c;
    --surface: #111116;
    --panel: #16161e;
    --accent: #e8ff47;
    --accent2: #ff4757;
    --text: #f0f0f0;
    --muted: #555566;
    --border: #222230;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--accent);
    line-height: 1;
  }

  .logo span {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 2px;
  }

  .header-controls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .layout-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .layout-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232, 255, 71, 0.08);
  }

  /* MAIN VIDEO AREA */
  #video-area {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }

  #video-area.layout-v { flex-direction: column; }
  #video-area.layout-h { flex-direction: row; }

  .video-slot {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--surface);
    overflow: hidden;
  }

  #video-area.layout-v .video-slot:first-child {
    border-bottom: 2px solid var(--accent);
  }
  #video-area.layout-h .video-slot:first-child {
    border-right: 2px solid var(--accent);
  }

  .video-wrapper {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #000;
    overflow: hidden;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* UPLOAD ZONE */
  .upload-zone {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .upload-zone:hover { background: rgba(232,255,71,0.03); }
  .upload-zone.hidden { display: none; }

  .upload-icon {
    width: 48px;
    height: 48px;
    border: 2px dashed var(--muted);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s;
  }

  .upload-zone:hover .upload-icon { border-color: var(--accent); }

  .upload-icon svg { color: var(--muted); transition: color 0.2s; }
  .upload-zone:hover .upload-icon svg { color: var(--accent); }

  .upload-text {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.6;
  }

  input[type="file"] { display: none; }

  /* SLOT LABEL */
  .slot-label {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--accent);
    pointer-events: none;
    z-index: 5;
  }

  .slot-label.hidden { display: none; }

  /* CHANGE VIDEO BTN */
  .change-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.7);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 1px;
    cursor: pointer;
    z-index: 5;
    font-family: 'DM Mono', monospace;
    display: none;
  }

  .change-btn:hover { color: var(--text); border-color: var(--muted); }

  /* CONTROLS BAR */
  #controls {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 16px 12px;
    flex-shrink: 0;
    z-index: 10;
  }

  /* SCRUBBER */
  .scrubber-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .time-label {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 36px;
    text-align: right;
  }

  #scrubber {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
    position: relative;
  }

  #scrubber::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px rgba(232,255,71,0.4);
  }

  /* CONTROL BUTTONS ROW */
  .btn-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .ctrl-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    font-family: 'DM Mono', monospace;
  }

  .ctrl-btn:active { transform: scale(0.93); }

  .ctrl-btn.primary {
    width: 52px;
    height: 52px;
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,255,71,0.06);
  }

  .ctrl-btn.primary:hover { background: rgba(232,255,71,0.12); }

  .ctrl-btn.secondary {
    width: 40px;
    height: 40px;
    font-size: 11px;
    color: var(--muted);
  }

  .ctrl-btn.secondary:hover { color: var(--text); border-color: var(--muted); }

  /* SPEED SELECTOR */
  .speed-select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    cursor: pointer;
    height: 40px;
    letter-spacing: 1px;
  }

  /* SYNC TOGGLE */
  .sync-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    margin-left: auto;
    cursor: pointer;
    user-select: none;
  }

  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.2s;
  }

  .sync-toggle.on .sync-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .sync-toggle.on { color: var(--accent); }

  /* FRAME STEP info */
  .frame-info {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    text-align: center;
    margin-top: 6px;
  }

  /* OFFSET ROW */
  .offset-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    padding: 8px 10px;
    background: var(--panel);
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  .offset-label {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .offset-label span {
    color: var(--accent);
    font-size: 11px;
    font-weight: 500;
  }

  #offset-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }

  #offset-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #ff4757;
    cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px rgba(255,71,87,0.5);
  }

  .offset-reset {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    padding: 3px 7px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  .offset-reset:hover { color: var(--text); border-color: var(--muted); }

  /* Individual seek buttons per video */
  .indiv-seek {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    justify-content: space-between;
  }

  .indiv-group {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .indiv-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    min-width: 16px;
  }

  .indiv-btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    letter-spacing: 1px;
  }

  .indiv-btn:active { transform: scale(0.93); }
  .indiv-btn:hover { color: var(--text); }

  /* OVERLAY EFFECT */
  .video-slot::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.3) 100%);
  }

  /* DRAG OVER STATE */
  .upload-zone.drag-over .upload-icon {
    border-color: var(--accent);
    background: rgba(232,255,71,0.1);
  }

</style>
</head>
<body>

<header>
  <div>
    <div class="logo">FORM<span> COMPARE</span></div>
  </div>
  <div class="header-controls">
    <button class="layout-btn active" id="btn-v" onclick="setLayout('v')">縦並び</button>
    <button class="layout-btn" id="btn-h" onclick="setLayout('h')">横並び</button>
  </div>
</header>

<div id="video-area" class="layout-v">

  <!-- SLOT A -->
  <div class="video-slot" id="slot-a">
    <div class="video-wrapper">
      <div class="upload-zone" id="zone-a" onclick="triggerFile('a')"
           ondragover="dragOver(event,'a')" ondragleave="dragLeave('a')" ondrop="dropFile(event,'a')">
        <div class="upload-icon">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M15 10l-4 4-4-4M12 14V3"/>
            <rect x="3" y="17" width="18" height="4" rx="2"/>
          </svg>
        </div>
        <div class="upload-text">VIDEO A<br>タップして選択</div>
      </div>
      <div class="slot-label hidden" id="label-a">VIDEO A</div>
      <button class="change-btn" id="change-a" onclick="triggerFile('a')">CHANGE</button>
      <video id="video-a" preload="metadata" playsinline></video>
    </div>
    <input type="file" id="file-a" accept="video/*" onchange="loadVideo('a', this)">
  </div>

  <!-- SLOT B -->
  <div class="video-slot" id="slot-b">
    <div class="video-wrapper">
      <div class="upload-zone" id="zone-b" onclick="triggerFile('b')"
           ondragover="dragOver(event,'b')" ondragleave="dragLeave('b')" ondrop="dropFile(event,'b')">
        <div class="upload-icon">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M15 10l-4 4-4-4M12 14V3"/>
            <rect x="3" y="17" width="18" height="4" rx="2"/>
          </svg>
        </div>
        <div class="upload-text">VIDEO B<br>タップして選択</div>
      </div>
      <div class="slot-label hidden" id="label-b">VIDEO B</div>
      <button class="change-btn" id="change-b" onclick="triggerFile('b')">CHANGE</button>
      <video id="video-b" preload="metadata" playsinline></video>
    </div>
    <input type="file" id="file-b" accept="video/*" onchange="loadVideo('b', this)">
  </div>

</div>

<!-- CONTROLS -->
<div id="controls">

  <!-- OFFSET ROW -->
  <div class="offset-row">
    <div class="offset-label">B オフセット: <span id="offset-val">0.00s</span></div>
    <input type="range" id="offset-slider" min="-10" max="10" step="0.05" value="0"
           oninput="setOffset(this.value)">
    <button class="offset-reset" onclick="resetOffset()">RESET</button>
  </div>

  <!-- INDIVIDUAL FRAME STEP -->
  <div class="indiv-seek">
    <div class="indiv-group">
      <div class="indiv-label">A</div>
      <button class="indiv-btn" onclick="seekFrameIndiv('a',-1)">◀ 1f</button>
      <button class="indiv-btn" onclick="seekFrameIndiv('a', 1)">1f ▶</button>
    </div>
    <div class="indiv-group">
      <div class="indiv-label" style="color:#ff4757">B</div>
      <button class="indiv-btn" onclick="seekFrameIndiv('b',-1)">◀ 1f</button>
      <button class="indiv-btn" onclick="seekFrameIndiv('b', 1)">1f ▶</button>
    </div>
  </div>

  <div class="scrubber-row">
    <span class="time-label" id="time-cur">0:00</span>
    <input type="range" id="scrubber" min="0" max="100" step="0.1" value="0"
           oninput="scrub(this.value)" onchange="scrub(this.value)">
    <span class="time-label" id="time-dur">0:00</span>
    <div class="sync-toggle on" id="sync-toggle" onclick="toggleSync()">
      <div class="sync-dot"></div>
      SYNC
    </div>
  </div>

  <div class="btn-row">
    <button class="ctrl-btn secondary" onclick="seekStep(-10)" title="-10秒">-10s</button>
    <button class="ctrl-btn secondary" onclick="seekFrame(-1)" title="前のフレーム">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button class="ctrl-btn primary" id="play-btn" onclick="togglePlay()">
      <svg id="play-icon" width="22" height="22" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg id="pause-icon" width="22" height="22" fill="currentColor" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="ctrl-btn secondary" onclick="seekFrame(1)" title="次のフレーム">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2.5-6 5.5 4V8l-5.5 4zM16 6h2v12h-2z"/></svg>
    </button>
    <button class="ctrl-btn secondary" onclick="seekStep(10)" title="+10秒">+10s</button>
    <select class="speed-select" id="speed-select" onchange="setSpeed(this.value)">
      <option value="0.25">0.25x</option>
      <option value="0.5">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
  </div>
  <div class="frame-info">A/B 個別フレーム送り ／ ◀▶ 同時フレーム送り</div>
</div>

<script>
  const vA = document.getElementById('video-a');
  const vB = document.getElementById('video-b');
  const scrubber = document.getElementById('scrubber');
  const timeCur = document.getElementById('time-cur');
  const timeDur = document.getElementById('time-dur');
  const playIcon = document.getElementById('play-icon');
  const pauseIcon = document.getElementById('pause-icon');

  let syncEnabled = true;
  let isSeeking = false;
  let hasA = false, hasB = false;
  // offsetB: how many seconds B is shifted relative to A
  // positive = B starts later (B plays content from later in the video at same A time)
  // negative = B starts earlier
  let offsetB = 0;
  let syncInterval = null;

  const FRAME = 1 / 30;
  const SYNC_THRESHOLD = 0.08; // seconds: only correct if drift exceeds this

  function fmt(t) {
    if (isNaN(t) || t < 0) t = 0;
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function fmtMs(t) {
    if (isNaN(t)) t = 0;
    const m = Math.floor(t / 60);
    const s = (Math.abs(t) % 60).toFixed(2).padStart(5, '0');
    return (t < 0 ? '-' : '') + `${Math.abs(m)}:${s}`;
  }

  // The "target" time for B given A's currentTime and offsetB
  function bTargetTime() {
    return vA.currentTime + offsetB;
  }

  function setLayout(dir) {
    const area = document.getElementById('video-area');
    area.className = 'layout-' + dir;
    document.getElementById('btn-v').classList.toggle('active', dir === 'v');
    document.getElementById('btn-h').classList.toggle('active', dir === 'h');
  }

  function triggerFile(id) {
    document.getElementById('file-' + id).click();
  }

  function loadVideo(id, input) {
    const file = input.files[0];
    if (!file) return;
    const vid = document.getElementById('video-' + id);
    const url = URL.createObjectURL(file);
    vid.src = url;
    vid.load();

    document.getElementById('zone-' + id).classList.add('hidden');
    document.getElementById('label-' + id).classList.remove('hidden');
    document.getElementById('change-' + id).style.display = 'block';

    if (id === 'a') { hasA = true; }
    else { hasB = true; }

    vid.addEventListener('loadedmetadata', () => {
      updateDuration();
    }, { once: true });

    vid.addEventListener('ended', () => {
      // check if both ended
      const aEnded = !hasA || vA.ended;
      const bEnded = !hasB || vB.ended;
      if (aEnded && bEnded) {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    });

    vid.playbackRate = parseFloat(document.getElementById('speed-select').value);
  }

  function dropFile(e, id) {
    e.preventDefault();
    dragLeave(id);
    const file = e.dataTransfer.files[0];
    if (!file || !file.type.startsWith('video/')) return;
    const input = document.getElementById('file-' + id);
    const dt = new DataTransfer();
    dt.items.add(file);
    input.files = dt.files;
    loadVideo(id, input);
  }

  function dragOver(e, id) {
    e.preventDefault();
    document.getElementById('zone-' + id).classList.add('drag-over');
  }

  function dragLeave(id) {
    document.getElementById('zone-' + id).classList.remove('drag-over');
  }

  function updateDuration() {
    const dur = (hasA && vA.duration) ? vA.duration : (hasB && vB.duration ? vB.duration : 0);
    timeDur.textContent = fmt(dur);
  }

  // Sync loop: periodically correct B's time based on A + offsetB
  function startSyncLoop() {
    stopSyncLoop();
    syncInterval = setInterval(() => {
      if (!syncEnabled || !hasA || !hasB || isSeeking) return;
      if (vA.paused) return;
      const target = bTargetTime();
      const clamped = Math.max(0, Math.min(vB.duration || Infinity, target));
      const diff = Math.abs(vB.currentTime - clamped);
      if (diff > SYNC_THRESHOLD) {
        vB.currentTime = clamped;
      }
    }, 500);
  }

  function stopSyncLoop() {
    if (syncInterval) { clearInterval(syncInterval); syncInterval = null; }
  }

  // Update scrubber from A
  vA.addEventListener('timeupdate', () => {
    if (isSeeking || !hasA) return;
    const pct = vA.duration ? (vA.currentTime / vA.duration) * 100 : 0;
    scrubber.value = pct;
    scrubber.style.background = `linear-gradient(to right, #e8ff47 ${pct}%, #222230 ${pct}%)`;
    timeCur.textContent = fmt(vA.currentTime);
  });

  function togglePlay() {
    const playing = (hasA && !vA.paused) || (hasB && !vB.paused);
    if (playing) {
      if (hasA) vA.pause();
      if (hasB) vB.pause();
      stopSyncLoop();
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    } else {
      // Align B before starting
      if (hasA && hasB && syncEnabled) {
        const target = Math.max(0, Math.min(vB.duration || Infinity, bTargetTime()));
        vB.currentTime = target;
      }
      if (hasA) vA.play().catch(()=>{});
      if (hasB) vB.play().catch(()=>{});
      startSyncLoop();
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    }
  }

  function scrub(val) {
    isSeeking = true;
    const pct = val / 100;
    if (hasA && vA.duration) vA.currentTime = vA.duration * pct;
    if (hasB && syncEnabled && vB.duration) {
      const target = Math.max(0, Math.min(vB.duration, bTargetTime()));
      vB.currentTime = target;
    }
    timeCur.textContent = fmt(vA.currentTime || 0);
    scrubber.style.background = `linear-gradient(to right, #e8ff47 ${val}%, #222230 ${val}%)`;
    setTimeout(() => { isSeeking = false; }, 150);
  }

  function seekStep(secs) {
    if (hasA) vA.currentTime = Math.max(0, Math.min(vA.duration || 0, vA.currentTime + secs));
    if (hasB && syncEnabled) {
      const target = Math.max(0, Math.min(vB.duration || 0, bTargetTime()));
      vB.currentTime = target;
    }
  }

  function seekFrame(dir) {
    if (hasA) vA.pause();
    if (hasB) vB.pause();
    stopSyncLoop();
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
    if (hasA) vA.currentTime = Math.max(0, Math.min(vA.duration || 0, vA.currentTime + dir * FRAME));
    if (hasB && syncEnabled) {
      const target = Math.max(0, Math.min(vB.duration || 0, bTargetTime()));
      vB.currentTime = target;
    }
  }

  // Individual frame seek (does NOT move the other video)
  function seekFrameIndiv(id, dir) {
    const vid = id === 'a' ? vA : vB;
    const has = id === 'a' ? hasA : hasB;
    if (!has) return;
    vid.pause();
    if (id === 'a') vB.pause();
    stopSyncLoop();
    playIcon.style.display = 'block';
    pauseIcon.style.display = 'none';
    vid.currentTime = Math.max(0, Math.min(vid.duration || 0, vid.currentTime + dir * FRAME));
    // Update offsetB based on new B position relative to A
    if (id === 'b' && hasA) {
      offsetB = vB.currentTime - vA.currentTime;
      document.getElementById('offset-slider').value = Math.max(-10, Math.min(10, offsetB));
      document.getElementById('offset-val').textContent = (offsetB >= 0 ? '+' : '') + offsetB.toFixed(2) + 's';
    }
  }

  function setSpeed(val) {
    const s = parseFloat(val);
    if (hasA) vA.playbackRate = s;
    if (hasB) vB.playbackRate = s;
  }

  function toggleSync() {
    syncEnabled = !syncEnabled;
    const el = document.getElementById('sync-toggle');
    el.classList.toggle('on', syncEnabled);
    if (!syncEnabled) stopSyncLoop();
  }

  function setOffset(val) {
    offsetB = parseFloat(val);
    document.getElementById('offset-val').textContent = (offsetB >= 0 ? '+' : '') + offsetB.toFixed(2) + 's';
    // Immediately apply to B if paused
    if (hasB && hasA) {
      const target = Math.max(0, Math.min(vB.duration || 0, bTargetTime()));
      vB.currentTime = target;
    }
  }

  function resetOffset() {
    offsetB = 0;
    document.getElementById('offset-slider').value = 0;
    document.getElementById('offset-val').textContent = '0.00s';
    if (hasB && hasA) {
      vB.currentTime = Math.max(0, Math.min(vB.duration || 0, vA.currentTime));
    }
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowLeft') { e.preventDefault(); seekFrame(-1); }
    if (e.code === 'ArrowRight') { e.preventDefault(); seekFrame(1); }
    if (e.code === 'KeyJ') seekStep(-10);
    if (e.code === 'KeyL') seekStep(10);
  });

  // Scrubber fill init
  scrubber.addEventListener('input', function() {
    const pct = this.value;
    this.style.background = `linear-gradient(to right, #e8ff47 ${pct}%, #222230 ${pct}%)`;
  });
</script>
</body>
</html>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js');
  });
}
